            // Add file button handler
            const addFileBtnEl = document.getElementById('add-file-btn');
            if (addFileBtnEl) {
                addFileBtnEl.addEventListener('click', addNewFile);
            }
            
            // Code editor handler
            const codeEditor = document.getElementById('code-editor');
            const codeEditorContainer = document.getElementById('code-editor-container');
            const codeEditorBackdrop = document.getElementById('code-editor-backdrop');
            const codeEditorLineNumbers = document.getElementById('code-editor-line-numbers');
            
            if (codeEditor && codeEditorContainer && codeEditorBackdrop && codeEditorLineNumbers) {
                // Position the cursor in the textarea based on eval state cursor
                const currState = getState(currentStep);
                if (currState.cursor && currState.cursor.file === activeFile) {
                    const content = codeEditor.value;
                    const lines = content.split('\n');
                    const targetLine = currState.cursor.line;
                    const targetCol = currState.cursor.column;
                    
                    // Calculate character offset from line and column
                    let charOffset = 0;
                    for (let i = 0; i < targetLine - 1 && i < lines.length; i++) {
                        charOffset += lines[i].length + 1; // +1 for newline
                    }
                    // Add column offset (clamped to line length)
                    const lineContent = lines[targetLine - 1] || '';
                    charOffset += Math.min(targetCol, lineContent.length);
                    
                    // Set cursor position and focus
                    codeEditor.focus();
                    codeEditor.setSelectionRange(charOffset, charOffset);
                }
                
                // Function to update the syntax-highlighted backdrop and line numbers
                const updateBackdrop = () => {
                    const content = codeEditor.value;
                    const lines = content.split('\n');
                    const language = getLanguageFromFilename(activeFile);
                    
                    let lineNumbersHtml = '';
                    let backdropHtml = '';
                    
                    lines.forEach((line, idx) => {
                        const lineNum = idx + 1;
                        const highlightedLine = highlightLine(line, language);
                        lineNumbersHtml += `<span class="line-num">${lineNum}</span>`;
                        backdropHtml += `<span class="highlighted-line"><code>${highlightedLine || ' '}</code></span>`;
                    });
                    
                    codeEditorLineNumbers.innerHTML = lineNumbersHtml;
                    codeEditorBackdrop.innerHTML = backdropHtml;
                };
                
                codeEditor.addEventListener('input', (e) => {
                    updateFileContent(e.target.value);
                    updateBackdrop();
                });
                
                // Sync scroll: container scrolls everything together
                codeEditorContainer.addEventListener('scroll', () => {
                    // Move the textarea content to match scroll position
                    codeEditor.scrollTop = codeEditorContainer.scrollTop;
                    codeEditor.scrollLeft = codeEditorContainer.scrollLeft;
                });
                
                // Handle tab key in editor
                codeEditor.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = codeEditor.selectionStart;
                        const end = codeEditor.selectionEnd;
                        codeEditor.value = codeEditor.value.substring(0, start) + '    ' + codeEditor.value.substring(end);
                        codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
                        updateFileContent(codeEditor.value);
                        updateBackdrop();
                    }
                });
            }
            
            // Cursor editor handlers
            const cursorFileSelect = document.getElementById('cursor-file-select');
            const cursorLineInput = document.getElementById('cursor-line-input');
            const cursorColInput = document.getElementById('cursor-col-input');
            
            if (cursorFileSelect && cursorLineInput && cursorColInput) {
                const updateCursorFromInputs = () => {
                    const file = cursorFileSelect.value;
                    const line = parseInt(cursorLineInput.value) || 1;
                    const column = parseInt(cursorColInput.value) || 0;
                    if (file) {
                        updateCursor(file, line, column);
                    } else {
                        // Clear cursor if no file selected
                        const currState = getState(currentStep);
                        delete currState.cursor;
                        markUnsaved();
                    }
                };
                
                cursorFileSelect.addEventListener('change', updateCursorFromInputs);
                cursorLineInput.addEventListener('change', updateCursorFromInputs);
                cursorColInput.addEventListener('change', updateCursorFromInputs);
            }
            
            // Assertions editor handler
            const assertionsEditor = document.getElementById('assertions-editor');
            if (assertionsEditor) {
                assertionsEditor.addEventListener('input', (e) => {
                    const currState = getState(currentStep);
                    const value = e.target.value.trim();
                    if (value) {
                        currState.judge_assertions = value;
                    } else {
                        delete currState.judge_assertions;
                    }
                    markUnsaved();
                });
            }
            
            // Setup cursor mode click handling
            const currCodeContainer = document.getElementById('curr-code');
            if (cursorMode && currCodeContainer) {
                currCodeContainer.classList.add('cursor-mode');
                currCodeContainer.addEventListener('click', handleCursorClick);
            }
            
            // Setup synchronized scrolling (only in non-edit mode)
            const prevCode = document.getElementById('prev-code');
            const currCode = document.getElementById('curr-code');
            
            if (prevCode && currCode && !editMode) {
                let scrolling = false;
                
                prevCode.addEventListener('scroll', () => {
                    if (!syncScroll || scrolling) return;
                    scrolling = true;
                    currCode.scrollTop = prevCode.scrollTop;
                    currCode.scrollLeft = prevCode.scrollLeft;
                    setTimeout(() => scrolling = false, 50);
                });
                
                currCode.addEventListener('scroll', () => {
                    if (!syncScroll || scrolling) return;
                    scrolling = true;
                    prevCode.scrollTop = currCode.scrollTop;
                    prevCode.scrollLeft = currCode.scrollLeft;
                    setTimeout(() => scrolling = false, 50);
                });
                
                // Scroll cursor into view on current side (only when not in cursor mode to avoid jumps during editing)
                if (currState.cursor?.file === activeFile && !cursorMode) {
                    const cursorLine = currCode.querySelector('.cursor-line');
                    if (cursorLine) {
                        cursorLine.scrollIntoView({ block: 'center', behavior: 'auto' });
                    }
                }
            }
        }

        function setupResizeHandles() {
            const leftTerminal = document.getElementById('left-terminal');
            const rightTerminal = document.getElementById('right-terminal');
            const rightAssertions = document.getElementById('right-assertions');
            
            // Apply persisted height
            if (leftTerminal) leftTerminal.style.height = terminalHeight + 'px';
            if (rightTerminal) rightTerminal.style.height = terminalHeight + 'px';
            if (rightAssertions) rightAssertions.style.height = assertionsHeight + 'px';
            
            document.querySelectorAll('.resize-handle').forEach(handle => {
                handle.addEventListener('mousedown', initResize);
            });
        }

        function initResize(e) {
            e.preventDefault();
            
            const handle = e.target;
            const panel = handle.dataset.panel;
            const leftTerminal = document.getElementById('left-terminal');
            const rightTerminal = document.getElementById('right-terminal');
            const rightAssertions = document.getElementById('right-assertions');
            
            const startY = e.clientY;
            const isAssertions = panel === 'assertions';
            const startHeight = isAssertions ? assertionsHeight : terminalHeight;
            
            // Disable text selection during drag
            document.body.style.userSelect = 'none';
            document.body.style.cursor = 'ns-resize';
            
            function onMouseMove(e) {
                // Calculate new height (dragging up increases height)
                const deltaY = startY - e.clientY;
                const newHeight = Math.max(80, Math.min(window.innerHeight * 0.7, startHeight + deltaY));
                
                if (isAssertions) {
                    assertionsHeight = newHeight;
                    if (rightAssertions) rightAssertions.style.height = newHeight + 'px';
                } else {
                    terminalHeight = newHeight;
                    // Apply to both terminals to keep them in sync
                    if (leftTerminal) leftTerminal.style.height = newHeight + 'px';
                    if (rightTerminal) rightTerminal.style.height = newHeight + 'px';
                }
            }
            
            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                document.body.style.userSelect = '';
                document.body.style.cursor = '';
            }
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }
    </script>
