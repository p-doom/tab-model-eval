    untitled: "# Git\n\nOverall goals: Keep people in Zed, do something for everyone,\
      \ build a git client we are proud of.\n\n## TODO\n\n# Incoming\n- [ ] Was following\
      \ broken by diffmap stuff?\n- [ ] Panics when following collaborator into project\
      \ diff view\n- [ ] Git diffs if file contains \\r\n- [ ] Have people noticed\
      \ that the initial sync \n\n  \n# To ship\n\n- [ ] [@conrad @max] DiffMap rewrite\n\
      \  - [@joão @conrad @max] Debugging / testing the diff map\n  - [x] Rebuilding\
      \ the editor interactions\n- [x] [@cole @mikayla] Git status rewrite\n- [*]\
      \ [@cole @mikayla @nate @kirill] Git Panel\n  - [*] [@nate] Show keybindings\
      \ on buttons\n  - [*] [@nate] Add a dropdown for switching repositories when\
      \ more than one\n    - `first repo` -> `selected repo`\n  - [ ] Add debug command\n\
      \  - [ ] Testing\n    - For the basic setup, want a (randomized?) test using\
      \ the\n      FakeGitRepository, that we can make changes to files, stage/unstage/commit\n\
      \      them using our new actions, and the resulting state of the (fake) filesystem/git\
      \ repo is what we expect\n    - Also test that git operations are sequenced\
      \ correctly.\n    - Then we should extend this to remote editing when that is\
      \ supported.\n    - Where will the tests live?\n  - [ ] Don't load single file\
      \ worktrees (settings.json, etc) for now\n    - test external imports as well\
      \ (cmd+clicking in)\n  - [ ] If not building overflow/context menu before shipping:\
      \ remove `...` icon on entries\n  \n## Stretch\n  - [ ] Reflect what a collaborator\
      \ can actually do in the UI\n    - If read only buttons should look disabled\
      \ for example\n    - add something like `GitPanel::is_read_only`\n  - [ ] Make\
      \ sure conflicts are sufficiently visible\n    - Mark with a ! at the end of\
      \ the entry\n  - [ ] Add collaboration/remote development support\n    - [ ]\
      \ collaborator can see leader's listing in git panel\n    - [ ] remote development:\
      \ show state of repo on remote machine\n  - [ ] [@cole] Add the diff line numbers\
      \ to the status information\n  - [ ] panel header buttons -> act on selected\
      \ entry, modifier swaps to \"all\" variants\n  - [ ] Track when at top or bottom\
      \ of list (scroll-position wise), add gradient overlay\n  - [@kirill] Query\
      \ for collaborators git.email\n      - check collaborators' .gitconfig for e-mails,\
      \ user names, etc.\n          `$ git config user.email`\n      -  ? consider\
      \ collab metadata?\n      -  ? ask the user for it?\n\n## Later / Idea dump\
      \   \n\n- Add \"CommitAllModified\"\n- [ ] Overflow menu for git top level actions\
      \ (`...` menu)\n- [ ] Context menu for selected entry\n- [ ] Overflow menu for\
      \ selected entry\n- [ ] [@cole] Restore the on-click behavior for specific status\
      \ lines\n- [ ] Add commit all (except untracked) button/shortcut\n- [ ] Add\
      \ a revert all command / button\n- [ ] Show a striped background for non-staged\
      \ hunks, and a solid background for staged ones\n- [ ] Make sure there's a 'suggest\
      \ a commit message' button somewhere if AI is enabled\n- [ ] Create the unified\
      \ diff view UI\n    \n  - [x] [@cole] Add the ability to create commits\n  \
      \  - [x] [@Disable commiting when no message\n    - [x] Disable commiting when\
      \ there are no changes\n    - [x] Disable commiting when nothing is staged (not\
      \ for CommitAllChanges)"
