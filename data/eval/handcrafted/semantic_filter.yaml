        import json
        from typing import List, Dict, Optional


        def load_products(filepath: str) -> List[Dict]:
            products = []
            with open(filepath, 'r') as f:
                for line in f:
                    products.append(json.loads(line))
            return products


        def get_product_by_id(products: List[Dict], product_id: int) -> Optional[Dict]:
            for product in products:
                if product['id'] == product_id:
                    return product
            return None


        def get_products_by_category(products: List[Dict], category: str) -> List[Dict]:
            return [p for p in products if p['category'] == category]


        def calculate_total_value(products: List[Dict]) -> float:
            return sum(p['price'] for p in products)


        def get_product_names(products: List[Dict]) -> List[str]:
            return [p['name'] for p in products]


        def get_expensive_products(products: List[Dict], threshold: float) -> List[Dict]:
            return [p for p in products if p['price'] > threshold]


        def count_by_category(products: List[Dict]) -> Dict[str, int]:
            counts = {}
            for p in products:
                cat = p['category']
                counts[cat] = counts.get(cat, 0) + 1
            return counts


        if __name__ == "__main__":
            products = load_products("products.jsonl")
            print(f"Loaded {len(products)} products")
            electronics = get_products_by_category(products, "electronics")
            print(f"Electronics: {len(electronics)}")
            expensive = get_expensive_products(products, 100.0)
            print(f"Expensive (>$100): {len(expensive)}")
            print(f"Categories: {count_by_category(products)}")
