        import argparse
        import logging
        from typing import Optional
        from services import (
            send_notification,
            send_bulk_notifications,
            get_notification_history,
            clear_notification_queue,
        )

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)


        def parse_args():
            parser = argparse.ArgumentParser(description="Notification CLI")
            parser.add_argument("--user-id", type=int, required=True)
            parser.add_argument("--message", type=str, required=True)
            parser.add_argument("--priority", type=str, default="normal")
            return parser.parse_args()


        def validate_priority(priority: str) -> bool:
            return priority in ("low", "normal", "high", "urgent")


        def get_user_name(user_id: int) -> str:
            names = {1: "Alice", 2: "Bob", 3: "Charlie"}
            return names.get(user_id, "Unknown")


        def log_notification_attempt(user_id: int, message: str, success: bool):
            status = "succeeded" if success else "failed"
            logger.info(f"Notification to user {user_id} {status}")


        def process_notification(user_id: int, message: str, priority: str) -> bool:
            if not validate_priority(priority):
                logger.error(f"Invalid priority: {priority}")
                return False
            
            name = get_user_name(user_id)
            full_message = f"Hello {name}, {message}"
            
            success = send_notification(user_id, full_message)
            log_notification_attempt(user_id, full_message, success)
            return success


        def process_bulk_notification(user_ids: list, message: str) -> dict:
            results = send_bulk_notifications(user_ids, message)
            for user_id, success in results.items():
                log_notification_attempt(user_id, message, success)
            return results


        def show_history(user_id: int):
            history = get_notification_history(user_id)
            for item in history:
                print(f"  {item['timestamp']}: {item['message']}")


        def main():
            args = parse_args()
            
            if not validate_priority(args.priority):
                print(f"Error: Invalid priority '{args.priority}'")
                return 1
            
            success = process_notification(args.user_id, args.message, args.priority)
            return 0 if success else 1


        if __name__ == "__main__":
            exit(main())
