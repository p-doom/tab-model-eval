        import numpy as np
        from typing import Union, List


        def elementwise_add(a: Union[int, float, List, np.ndarray],
                            b: Union[int, float, List, np.ndarray]) -> Union[int, float, List, np.ndarray]:
            """Add two values element-wise. Supports scalars, lists, and numpy arrays."""
            if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                return a + b
            elif isinstance(a, list) and isinstance(b, list):
                return [x + y for x, y in zip(a, b)]
            elif isinstance(a, np.ndarray) or isinstance(b, np.ndarray):
                return np.add(a, b)
            raise TypeError(f"Unsupported types: {type(a)}, {type(b)}")


        def elementwise_multiply(a: Union[int, float, List, np.ndarray],
                                 b: Union[int, float, List, np.ndarray]) -> Union[int, float, List, np.ndarray]:
            """Multiply two values element-wise. Supports scalars, lists, and numpy arrays."""
            if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                return a * b
            elif isinstance(a, list) and isinstance(b, list):
                return [x * y for x, y in zip(a, b)]
            elif isinstance(a, np.ndarray) or isinstance(b, np.ndarray):
                return np.multiply(a, b)
            raise TypeError(f"Unsupported types: {type(a)}, {type(b)}")


        def normalize(data: Union[List, np.ndarray]) -> np.ndarray:
            """Normalize data to zero mean and unit variance."""
            arr = np.array(data)
            return (arr - arr.mean()) / arr.std()
