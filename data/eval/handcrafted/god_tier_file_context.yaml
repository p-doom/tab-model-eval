              return ""
          return email.split('@')[1]


      def mask_email(email: str) -> str:
          if '@' not in email:
              return email
          local, domain = email.split('@')
          if len(local) <= 2:
              return f"{local[0]}***@{domain}"
          return f"{local[0]}{'*' * (len(local) - 2)}{local[-1]}@{domain}"


      def mask_phone(phone: str) -> str:
          digits = re.sub(r'\D', '', phone)
          if len(digits) < 4:
              return phone
          return '*' * (len(digits) - 4) + digits[-4:]


      def bytes_to_human(size: int) -> str:
          for unit in ['B', 'KB', 'MB', 'GB', 'TB']:
              if size < 1024:
                  return f"{size:.2f} {unit}"
              size /= 1024
          return f"{size:.2f} PB"


      def human_to_bytes(size_str: str) -> int:
          units = {'B': 1, 'KB': 1024, 'MB': 1024**2, 'GB': 1024**3, 'TB': 1024**4}
          match = re.match(r'([\d.]+)\s*(\w+)', size_str)
          if not match:
              raise ValueError(f"Invalid size string: {size_str}")
          value, unit = match.groups()
          return int(float(value) * units.get(unit.upper(), 1))


      def flatten_dict(d: Dict, parent_key: str = '', sep: str = '.') -> Dict:
          items = []
          for k, v in d.items():
              new_key = f"{parent_key}{sep}{k}" if parent_key else k
              if isinstance(v, dict):
                  items.extend(flatten_dict(v, new_key, sep).items())
              else:
                  items.append((new_key, v))
          return dict(items)


      def unflatten_dict(d: Dict, sep: str = '.') -> Dict:
          result = {}
          for key, value in d.items():
              parts = key.split(sep)
              current = result
              for part in parts[:-1]:
                  current = current.setdefault(part, {})
              current[parts[-1]] = value
          return result


      def deep_merge(base: Dict, override: Dict) -> Dict:
          result = base.copy()
          for key, value in override.items():
              if key in result and isinstance(result[key], dict) and isinstance(value, dict):
                  result[key] = deep_merge(result[key], value)
              else:
                  result[key] = value
          return result


      def get_nested_value(d: Dict, path: str, default: Any = None) -> Any:
          keys = path.split('.')
          current = d
          for key in keys:
              if isinstance(current, dict) and key in current:
                  current = current[key]
              else:
                  return default
          return current


      def set_nested_value(d: Dict, path: str, value: Any) -> None:
          keys = path.split('.')
          current = d
          for key in keys[:-1]:
              current = current.setdefault(key, {})
          current[keys[-1]] = value


      def chunk_list(lst: List, chunk_size: int) -> List[List]:
          return [lst[i:i + chunk_size] for i in range(0, len(lst), chunk_size)]


      def deduplicate_list(lst: List) -> List:
          seen = set()
          result = []
          for item in lst:
              key = json.dumps(item, sort_keys=True) if isinstance(item, dict) else item
              if key not in seen:
                  seen.add(key)
                  result.append(item)
          return result


      def safe_divide(a: float, b: float, default: float = 0.0) -> float:
          if b == 0:
              return default
          return a / b


      def clamp(value: float, min_val: float, max_val: float) -> float:
          return max(min_val, min(max_val, value))


      def percentage(part: float, whole: float, decimals: int = 2) -> float:
          if whole == 0:
              return 0.0
          return round((part / whole) * 100, decimals)


      def round_to_nearest(value: float, nearest: float) -> float:
          return round(value / nearest) * nearest


      def snake_to_camel(s: str) -> str:
