      def pluralize(word: str, count: int) -> str:
          if count == 1:
              return word
          if word.endswith('y'):
              return word[:-1] + 'ies'
          if word.endswith(('s', 'x', 'z', 'ch', 'sh')):
              return word + 'es'
          return word + 's'


