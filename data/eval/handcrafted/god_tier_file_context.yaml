      def remove_comments(code: str, lang: str = 'python') -> str:
          if lang == 'python':
              return re.sub(r'#.*$', '', code, flags=re.MULTILINE)
          elif lang in ('javascript', 'java', 'c'):
              code = re.sub(r'//.*$', '', code, flags=re.MULTILINE)
              code = re.sub(r'/\*.*?\*/', '', code, flags=re.DOTALL)
              return code
          return code


