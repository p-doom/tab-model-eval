        import os
        import stripe
        from typing import Dict, Optional
        from dataclasses import dataclass
        from datetime import datetime


        @dataclass
        class PaymentResult:
            success: bool
            transaction_id: Optional[str]
            error_message: Optional[str]
            amount: int
            currency: str
            timestamp: datetime


        class PaymentProcessor:
            def __init__(self):
                self.api_key = None
                self.webhook_secret = None
                self._initialized = False

            def initialize(self):
                if self._initialized:
                    return
                self.api_key = os.getenv("STRIPE_SECRET_KEY")
                self.webhook_secret = os.getenv("STRIPE_WEBHOOK_SECRET")
                if not self.api_key:
                    raise ValueError("Stripe API key not configured")
                stripe.api_key = self.api_key
                self._initialized = True

            def create_payment_intent(
                self,
                amount: int,
                currency: str = "usd",
                metadata: Optional[Dict] = None
            ) -> PaymentResult:
                self.initialize()
                try:
                    intent = stripe.PaymentIntent.create(
                        amount=amount,
                        currency=currency,
                        metadata=metadata or {}
                    )
                    return PaymentResult(
                        success=True,
                        transaction_id=intent.id,
                        error_message=None,
                        amount=amount,
                        currency=currency,
                        timestamp=datetime.now()
                    )
                except stripe.error.StripeError as e:
                    return PaymentResult(
                        success=False,
                        transaction_id=None,
                        error_message=str(e),
                        amount=amount,
                        currency=currency,
                        timestamp=datetime.now()
                    )

            def verify_webhook(self, payload: bytes, signature: str) -> bool:
                try:
                    stripe.Webhook.construct_event(
                        payload, signature, self.webhook_secret
                    )
                    return True
                except ValueError:
                    return False


        def get_publishable_key() -> str:
            key = os.getenv("STRIPE_PUBLISHABLE_KEY")
            if not key:
                raise ValueError("Stripe publishable key not configured")
            return key


        def create_customer(email: str, name: str) -> Dict:
            processor = PaymentProcessor()
            processor.initialize()
            customer = stripe.Customer.create(email=email, name=name)
            return {"id": customer.id, "email": email}


        def process_refund(payment_intent_id: str, amount: Optional[int] = None) -> Dict:
            processor = PaymentProcessor()
            processor.initialize()
            refund = stripe.Refund.create(
                payment_intent=payment_intent_id,
                amount=amount
            )
            return {"refund_id": refund.id, "status": refund.status}


        def is_test_mode() -> bool:
            key = os.getenv("STRIPE_PUBLISHABLE_KEY")
            return key is not None and key.startswith("pk_test_")
