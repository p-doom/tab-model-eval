        import torch
        import torch.nn as nn
        import torch.nn.functional as F

        class TransformerBlock(nn.Module):
            def __init__(self, hidden_dim, num_heads, mlp_ratio=4):
                super().__init__()
                self.hidden_dim = hidden_dim
                self.num_heads = num_heads
                self.head_dim = hidden_dim // num_heads
                
                self.ln1 = nn.LayerNorm(hidden_dim)
                self.qkv = nn.Linear(hidden_dim, 3 * hidden_dim)
                self.proj = nn.Linear(hidden_dim, hidden_dim)
                
                self.ln2 = nn.LayerNorm(hidden_dim)
                self.mlp = nn.Sequential(
                    nn.Linear(hidden_dim, hidden_dim * mlp_ratio),
                    nn.GELU(),
                    nn.Linear(hidden_dim * mlp_ratio, hidden_dim)
                )
            
            def forward(self, x):
                B, T, D = x.shape
                
                # Self-attention
                normed = self.ln1(x)
                qkv = self.qkv(normed)
                qkv = qkv.reshape(B, T, 3, self.num_heads, self.head_dim)
                qkv = qkv.permute(2, 0, 3, 1, 4)
                q, k, v = qkv[0], qkv[1], qkv[2]
                
                attn = (q @ k.transpose(-2, -1)) * (self.head_dim ** -0.5)
                attn = F.softmax(attn, dim=-1)
                out = attn @ v
                out = out.transpose(1, 2).reshape(B, T, D)
                out = self.proj(out)
                x = x + out
                
                # MLP
                x = x + self.mlp(self.ln2(x))
                return x


        class Transformer(nn.Module):
            def __init__(self, vocab_size, hidden_dim, num_layers, num_heads):
                super().__init__()
                self.embed = nn.Embedding(vocab_size, hidden_dim)
                self.blocks = nn.ModuleList([
                    TransformerBlock(hidden_dim, num_heads) for _ in range(num_layers)
                ])
                self.ln_f = nn.LayerNorm(hidden_dim)
                self.head = nn.Linear(hidden_dim, vocab_size)
            
            def forward(self, x):
                x = self.embed(x)
                for block in self.blocks:
                    x = block(x)
                x = self.ln_f(x)
                logits = self.head(x)
                return logits


        if __name__ == "__main__":
            model = Transformer(vocab_size=50257, hidden_dim=512, num_layers=6, num_heads=8)
            x = torch.randint(0, 50257, (4, 128))
            logits = model(x)
            print(f"Output shape: {logits.shape}")
