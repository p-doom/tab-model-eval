    src/model.py: "import torch\nimport torch.nn as nn\nimport torch.nn.functional\
      \ as F\n\nclass TransformerBlock(nn.Module):\n    def __init__(self, hidden_dim,\
      \ num_heads, mlp_ratio=4):\n        super().__init__()\n        self.hidden_dim\
      \ = hidden_dim\n        self.num_heads = num_heads\n        self.head_dim =\
      \ hidden_dim // num_heads\n        \n        self.ln1 = nn.LayerNorm(hidden_dim)\n\
      \        self.qkv = nn.Linear(hidden_dim, 3 * hidden_dim)\n        self.proj\
      \ = nn.Linear(hidden_dim, hidden_dim)\n        \n        self.ln2 = nn.LayerNorm(hidden_dim)\n\
      \        self.mlp = nn.Sequential(\n            nn.Linear(hidden_dim, hidden_dim\
      \ * mlp_ratio),\n            nn.GELU(),\n            nn.Linear(hidden_dim *\
      \ mlp_ratio, hidden_dim)\n        )\n    \n    def forward(self, x):\n     \
      \   B, T, D = x.shape\n        \n        # Self-attention\n        normed =\
      \ self.ln1(x)\n        qkv = self.qkv(normed)\n        qkv = qkv.reshape(B,\
      \ T, 3, self.num_heads, self.head_dim)\n        qkv = qkv.permute(2, 0, 3, 1,\
      \ 4)\n        q, k, v = qkv[0], qkv[1], qkv[2]\n        \n        attn = (q\
      \ @ k.transpose(-2, -1)) * (self.head_dim ** -0.5)\n        attn = F.softmax(attn,\
      \ dim=-1)\n        out = attn @ v\n        out = out.transpose(1, 2).reshape(B,\
      \ T, D)\n        out = self.proj(out)\n        x = x + out\n        \n     \
      \   # MLP\n        x = x + self.mlp(self.ln2(x))\n        return x\n\n\nclass\
      \ Transformer(nn.Module):\n    def __init__(self, vocab_size, hidden_dim, num_layers,\
      \ num_heads):\n        super().__init__()\n        self.embed = nn.Embedding(vocab_size,\
      \ hidden_dim)\n        self.blocks = nn.ModuleList([\n            TransformerBlock(hidden_dim,\
      \ num_heads) for _ in range(num_layers)\n        ])\n        self.ln_f = nn.LayerNorm(hidden_dim)\n\
      \        self.head = nn.Linear(hidden_dim, vocab_size)\n    \n    def forward(self,\
      \ x):\n        x = self.embed(x)\n        for block in self.blocks:\n      \
      \      x = block(x)\n        x = self.ln_f(x)\n        logits = self.head(x)\n\
      \        return logits\n\n\nif __name__ == \"__main__\":\n    model = Transformer(vocab_size=50257,\
      \ hidden_dim=512, num_layers=6, num_heads=8)\n    x = torch.randint(0, 50257,\
      \ (4, 128))\n    logits = model(x)\n    print(f\"Output shape: {logits.shape}\"\
      )"
