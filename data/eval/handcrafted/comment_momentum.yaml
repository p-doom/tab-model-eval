        import torch
        import torch.nn as nn
        import torch.nn.functional as F


        class TransformerBlock(nn.Module):
            def __init__(self, dim, num_heads, mlp_ratio=4.0, dropout=0.1):
                super().__init__()
                self.attn = nn.MultiheadAttention(dim, num_heads, dropout=dropout, batch_first=True)
                self.mlp = nn.Sequential(
                    nn.Linear(dim, int(dim * mlp_ratio)),
                    nn.GELU(),
                    nn.Dropout(dropout),
                    nn.Linear(int(dim * mlp_ratio), dim),
                    nn.Dropout(dropout)
                )
                self.ln1 = nn.LayerNorm(dim)
                self.ln2 = nn.LayerNorm(dim)
                self.dropout = nn.Dropout(dropout)

            def forward(self, x):
                attn_out, _ = self.attn(x, x, x)
                attn_out = self.dropout(attn_out)
                x = x + attn_out
                x = self.ln1(x)
                mlp_out = self.mlp(x)
                x = x + mlp_out
                x = self.ln2(x)
                return x


        class Transformer(nn.Module):
            def __init__(self, vocab_size, dim, num_heads, num_layers, max_seq_len=512):
                super().__init__()
                self.embedding = nn.Embedding(vocab_size, dim)
                self.pos_embedding = nn.Embedding(max_seq_len, dim)
                self.blocks = nn.ModuleList([
                    TransformerBlock(dim, num_heads) for _ in range(num_layers)
                ])
                self.ln_f = nn.LayerNorm(dim)
                self.head = nn.Linear(dim, vocab_size)

            def forward(self, x):
                B, T = x.shape
                tok_emb = self.embedding(x)
                pos_emb = self.pos_embedding(torch.arange(T, device=x.device))
                x = tok_emb + pos_emb
                for block in self.blocks:
                    x = block(x)
                x = self.ln_f(x)
                return self.head(x)


        if __name__ == "__main__":
            model = Transformer(vocab_size=10000, dim=256, num_heads=8, num_layers=6)
            x = torch.randint(0, 10000, (2, 128))
            out = model(x)
            print(f"Input: {x.shape}, Output: {out.shape}")
