                self.pos_embedding = nn.Embedding(max_seq_len, dim)
                self.blocks = nn.ModuleList([
                    TransformerBlock(dim, num_heads) for _ in range(num_layers)
                ])
                self.ln_f = nn.LayerNorm(dim)
                self.head = nn.Linear(dim, vocab_size)

            def forward(self, x):
                B, T = x.shape
                tok_emb = self.embedding(x)
                pos_emb = self.pos_embedding(torch.arange(T, device=x.device))
                x = tok_emb + pos_emb
                for block in self.blocks:
                    x = block(x)
                x = self.ln_f(x)
                return self.head(x)


        if __name__ == "__main__":
            model = Transformer(vocab_size=10000, dim=256, num_heads=8, num_layers=6)
            x = torch.randint(0, 10000, (2, 128))
            out = model(x)
            print(f"Input: {x.shape}, Output: {out.shape}")
