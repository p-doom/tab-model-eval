        import jax
        import jax.numpy as jnp
        import optax
        from model import create_model, apply_model
        from data import create_dataloader


        def compute_loss(params, batch):
            inputs, targets = batch
            logits = apply_model(params, inputs)
            loss = optax.softmax_cross_entropy_with_integer_labels(logits, targets)
            return jnp.mean(loss)


        @jax.jit
        def train_step(params, opt_state, batch):
            loss, grads = jax.value_and_grad(compute_loss)(params, batch)
            updates, opt_state = optimizer.update(grads, opt_state, params)
            params = optax.apply_updates(params, updates)
            return params, opt_state, loss


        def main():
            rng = jax.random.PRNGKey(42)
            params = create_model(rng)
            
            global optimizer
            optimizer = optax.adam(learning_rate=1e-3)
            opt_state = optimizer.init(params)
            
            dataloader = create_dataloader(batch_size=32)
            
            # for epoch in range(100):
            #     for batch in dataloader:
            #         params, opt_state, loss = train_step(params, opt_state, batch)
            #     print(f"Epoch {epoch}, Loss: {loss:.4f}")
            
            # overfit on one single batch
            batch = next(iter(dataloader))
            step = 0
            while True:
                params, opt_state, loss = train_step(params, opt_state, batch)
                step += 1
                if step % 100 == 0:
                    print(f"Step {step}, Loss: {loss:.4f}")

        if __name__ == "__main__":
            main()
